
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportIS - Enterprise Support Management</title>
    <meta name="description" content="A plataforma definitiva para gerenciamento de equipamentos críticos." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Sans:wght@300..800&display=swap" rel="stylesheet" />
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#135bec',
                hover: '#0f48bd',
                light: 'rgba(19, 91, 236, 0.1)',
              },
              background: {
                dark: '#101622',
                surface: '#111722',
                card: '#1a2332',
                input: '#192233'
              },
              border: {
                dark: '#2a3649',
                light: '#324467'
              },
              text: {
                secondary: '#92a4c9',
                muted: '#63748e'
              },
              success: '#0bda5e',
              warning: '#fa6238',
            },
            fontFamily: {
              sans: ['Manrope', 'Noto Sans', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #101622;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a3649;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #324467;
      }
      body {
        background-color: #101622;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
